# Catppuccin {{name}} — generated by theme-set; edit theme/templates/wob.ini in Firelink instead.
# Volume/brightness OSD (fed by Firelink's bin/osd). Colors are RRGGBBAA.
timeout = 1200
max = 100
width = 320
height = 36
border_size = 2
border_offset = 0
bar_padding = 6
anchor = bottom
margin = 120

background_color = {{base}}f2
border_color = {{surface1}}ff
bar_color = {{blue}}ff

[style.muted]
bar_color = {{overlay0}}ff
