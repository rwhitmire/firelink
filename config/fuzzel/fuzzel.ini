# Firelink's fuzzel defaults, included by ~/.config/fuzzel/fuzzel.ini. Colors come from
# theme.ini, generated by theme-set.

[main]
font=Adwaita Sans:size=12
prompt="❯  "
icon-theme=Adwaita
terminal=alacritty -e
width=40
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=10
line-height=24
layer=overlay
# Size fonts by output scale, not physical DPI: the laptop panel (~157 DPI) vs
# the Dell (~92 DPI) otherwise makes the launcher ~1.7x larger on the laptop.
dpi-aware=no
include=~/.config/fuzzel/theme.ini

[border]
width=1
radius=12
selection-radius=8
