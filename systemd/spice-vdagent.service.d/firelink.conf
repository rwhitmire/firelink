# Firelink's drop-in for spice-vdagent's session agent (VMs only; nothing to do
# elsewhere). In niri it moves the pointer using Xwayland's screen layout, which
# doesn't match niri's, so the cursor lands off from the host's. The system
# daemon (spice-vdagentd) still makes the screen follow the VM window, and the
# VM's tablet device moves the pointer. Other sessions (GNOME) keep the agent.
[Unit]
ConditionEnvironment=!XDG_CURRENT_DESKTOP=niri
